<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>RoadGuard - Report Hazard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-container">
        <div class="page-header">
            <button class="back-btn-nav" id="backBtn"><i class="fas fa-arrow-left"></i> Back</button>
            <h2>Report Hazard</h2>
            <div style="width: 50px;"></div>
        </div>
        
        <div class="page-content">
            <form id="hazardReportForm">
                <div class="form-group">
                    <label>Hazard Type *</label>
                    <select id="hazardType" required>
                        <option value="Pothole">Pothole</option>
                        <option value="Fallen Tree">Fallen Tree</option>
                        <option value="Debris">Debris</option>
                        <option value="Broken Streetlight">Broken Streetlight</option>
                        <option value="Flooding">Flooding</option>
                        <option value="Damaged Sign">Damaged Traffic Sign</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="description" rows="3" placeholder="Describe the hazard..."></textarea>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-camera"></i> Upload Image (Optional)</label>
                    <input type="file" id="hazardImage" accept="image/jpeg,image/png,image/jpg">
                    <div id="imagePreviewContainer"></div>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-map-marker-alt"></i> Select Location on Map</label>
                    <button type="button" id="getLocationBtn" class="primary location-btn">📍 Use My Current Location</button>
                    
                    <div class="location-inputs">
                        <input type="text" id="latInput" placeholder="Latitude" readonly>
                        <input type="text" id="lngInput" placeholder="Longitude" readonly>
                    </div>
                    <div class="small-note">👇 Click on the map below to set location</div>
                </div>
                
                <!-- Mini map preview - USING ID not class -->
                <div id="miniMap"></div>
                
                <button type="submit" class="primary submit-btn">Submit Report</button>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="report.js"></script>
</body>
</html>
