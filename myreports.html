<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>RoadGuard - My Reports</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-container">
        <div class="page-header">
            <button class="back-btn-nav" id="backBtn"><i class="fas fa-arrow-left"></i> Back</button>
            <h2>My Reports</h2>
            <button class="refresh-btn" id="refreshBtn" style="background:none; border:none; font-size:1.2rem; cursor:pointer;">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
        
        <div class="page-content" id="myReportsList">
            <div class="loading-message">Loading your reports...</div>
        </div>
    </div>

    <script src="myreport.js"></script>
</body>
</html>
